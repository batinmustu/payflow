name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the latest run per ref needs to stay alive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (.NET 8, ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Cache key invalidates when any csproj or central package file changes.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PayFlow.sln

      - name: Build (Release, no restore)
        # Directory.Build.props sets TreatWarningsAsErrors + EnforceCodeStyleInBuild,
        # so a style or analyzer regression breaks CI here.
        run: dotnet build PayFlow.sln --no-restore --configuration Release

      - name: Test (Release, no build)
        run: |
          dotnet test PayFlow.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/*.trx
          if-no-files-found: warn
          retention-days: 7

  # ---- Docker image build (matrix, one job per service) -------------------
  # Builds every service image to verify the Dockerfile + build context stay
  # green. Push is off by default — flip the `push:` line + the login step
  # to publish to a registry (set DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, or
  # swap the login for GHCR/ECR).
  docker:
    name: docker / ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only build images on pushes to main — PRs run the test job only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: identity,       dir: src/Services/Identity/PayFlow.Identity.API,             project: PayFlow.Identity.API }
          - { name: payment,        dir: src/Services/Payment/PayFlow.Payment.API,               project: PayFlow.Payment.API }
          - { name: transaction,    dir: src/Services/Transaction/PayFlow.Transaction.API,       project: PayFlow.Transaction.API }
          - { name: reconciliation, dir: src/Services/Reconciliation/PayFlow.Reconciliation.API, project: PayFlow.Reconciliation.API }
          - { name: reporting,      dir: src/Services/Reporting/PayFlow.Reporting.API,           project: PayFlow.Reporting.API }
          - { name: notification,   dir: src/Services/Notification/PayFlow.Notification.API,     project: PayFlow.Notification.API }
          - { name: webhooks,       dir: src/Services/Webhooks/PayFlow.Webhooks.API,             project: PayFlow.Webhooks.API }
          - { name: gateway,        dir: src/ApiGateway/PayFlow.Gateway,                         project: PayFlow.Gateway }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Docker login
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.service
          push: false  # flip to true once credentials are wired
          tags: |
            payflow/${{ matrix.service.name }}:${{ github.sha }}
            payflow/${{ matrix.service.name }}:latest
          build-args: |
            PROJECT_DIR=${{ matrix.service.dir }}
            PROJECT_NAME=${{ matrix.service.project }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,scope=${{ matrix.service.name }},mode=max
