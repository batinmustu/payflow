{{- $root := . -}}
{{- range $name, $svc := .Values.services -}}
{{- if $svc.enabled -}}
{{- $defaults := $root.Values.defaults -}}
{{- $replicas := default $defaults.replicas $svc.replicas -}}
{{- $resources := default $defaults.resources $svc.resources -}}
{{- $liveness := default $defaults.livenessProbe $svc.livenessProbe -}}
{{- $readiness := default $defaults.readinessProbe $svc.readinessProbe -}}
{{- $serviceCfg := default $defaults.service $svc.service -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payflow.serviceFullname" $name }}
  labels:
    {{- include "payflow.serviceLabels" (list $root $name) | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/part-of: payflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: payflow
    spec:
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "payflow.image" (list $root $svc) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: payflow-shared-config
          env:
            # DB credentials come from the shared secret. The connection
            # string interpolation $(PG_*) is resolved by kubelet at
            # container start, so plaintext never lands on the YAML.
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: payflow-shared-secrets
                  key: PG_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payflow-shared-secrets
                  key: PG_PASSWORD
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: payflow-shared-secrets
                  key: PG_DB
            - name: Identity__Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: payflow-shared-secrets
                  key: Identity__Jwt__SigningKey
            {{- range $k, $v := $svc.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml $liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml $readiness | nindent 12 }}
          resources:
            {{- toYaml $resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "payflow.serviceFullname" $name }}
  labels:
    {{- include "payflow.serviceLabels" (list $root $name) | nindent 4 }}
spec:
  type: {{ $serviceCfg.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $serviceCfg.port }}
      targetPort: http
{{- end }}
{{- end }}
