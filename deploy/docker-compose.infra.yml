# PayFlow — infrastructure-only stack for local development.
# See docs/devops/local-stack.md for the full bring-up flow.
#
# Bring up:    docker compose -f deploy/docker-compose.infra.yml up -d
# Bring down:  docker compose -f deploy/docker-compose.infra.yml down
# Wipe data:   docker compose -f deploy/docker-compose.infra.yml down -v

name: payflow-infra

services:

  # ---- Data stores --------------------------------------------------------

  postgres:
    image: pgvector/pgvector:pg16
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    # Host port 5433 (not 5432) so a developer's native Postgres on 5432
    # does not collide. Container port stays 5432 — services connecting
    # over the docker network still use 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Host port 6380 (not 6379) so a developer's native Redis on 6379 does
    # not win the "127.0.0.1 specific binding > docker wildcard" race —
    # same shape as the postgres conflict on 5432/5433.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Messaging ----------------------------------------------------------

  kafka:
    image: apache/kafka:3.7.2
    container_name: payflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft (no ZooKeeper). Apache official image uses KAFKA_* prefix
      # (Bitnami used KAFKA_CFG_*).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single-broker dev cluster — replication has nothing to replicate to.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Dev only — services and tests rely on this.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payflow-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI — http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Observability ------------------------------------------------------

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: payflow-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"    # UI — http://localhost:16686
    # 4317/4318 are NOT host-published: OTel Collector owns those ports.
    # The collector forwards traces to jaeger over the docker network.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OTel Collector is the single OTLP intake for every PayFlow service.
  # It fans out traces to Jaeger and exports metrics on its own
  # /metrics endpoint for Prometheus to scrape.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: payflow-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC — services point OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4318:4318"      # OTLP HTTP
      - "8889:8889"      # Prometheus scrape endpoint
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: payflow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"      # UI — http://localhost:9090
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.0
    container_name: payflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"      # UI — http://localhost:3000 (admin / admin)
    depends_on:
      prometheus:
        condition: service_started

  seq:
    image: datalust/seq:2024.3
    container_name: payflow-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"        # UI + ingestion — http://localhost:5341
    volumes:
      - seq-data:/data
    healthcheck:
      # Seq image ships neither wget nor curl; use bash's TCP probe.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/80"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  kafka-data:
  rabbitmq-data:
  seq-data:
  prometheus-data:
  grafana-data:
