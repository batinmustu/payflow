# OpenTelemetry Collector — receives OTLP from PayFlow services and fans it
# out to Jaeger (traces) and Prometheus (metrics). Logs aren't routed through
# the collector — Serilog ships them direct to Seq.
#
# Tail the collector: docker logs -f payflow-otel-collector
# Prometheus endpoint: http://otel-collector:8889/metrics  (scraped by Prometheus)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Lifts the OTel resource attribute `service.name` to a metric label so
  # Prometheus queries can group by it.
  resource:
    attributes:
      - key: service.name
        action: insert
        from_attribute: service.name

exporters:
  # Jaeger native OTLP intake (1.35+).
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Pull-style endpoint Prometheus scrapes.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus]
