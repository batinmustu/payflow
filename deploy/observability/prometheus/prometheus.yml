# Prometheus scrape config for the PayFlow observability stack.
# Only one scrape target: the OTel Collector's prometheus exporter, which
# already aggregates metrics from every PayFlow service. Adding more
# services here is unnecessary — they push to the collector via OTLP.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: payflow-local

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
        labels:
          source: otel-collector

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
